images:
  gateway: urumi/gateway:latest
  dashboard: urumi/dashboard:latest
  wooMcp: urumi/woo-mcp:latest
  weatherMcp: urumi/weather-mcp:latest
  currencyMcp: urumi/currency-mcp:latest
  pullPolicy: IfNotPresent
ingress:
  className: traefik
  storeHost: store.urumi.local
  dashboardHost: dashboard.urumi.local
  tlsSecret: ""            # set in prod (cert-manager / manual)
storage:
  className: ""            # "" = cluster default (local-path on k3d/k3s)
  mysql: 2Gi
  wordpress: 2Gi
  postgres: 1Gi
replicas: {gateway: 1, dashboard: 1, mcp: 1}
resources:
  small: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
  db: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
# Dev defaults ONLY. Override via --set or an external secret in prod (see values-prod.yaml).
secrets:
  mysqlRootPassword: rootpass
  mysqlPassword: wppass
  postgresPassword: pgpass
  gatewaySecretKey: change-me-gateway-secret
  bootstrapAdminKey: urumi_live_bootstrap_admin_key_change_me
  wpAdminPassword: admin123
  wooConsumerKey: ck_0123456789abcdef0123456789abcdef01234567
  wooConsumerSecret: cs_0123456789abcdef0123456789abcdef01234567
  wooMcpToken: woo-mcp-internal-token
  anthropicApiKey: ""
networkPolicies: true
