apiVersion: v1
kind: Secret
metadata: {name: urumi-secrets}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  gateway-secret-key: {{ .Values.secrets.gatewaySecretKey | quote }}
  bootstrap-admin-key: {{ .Values.secrets.bootstrapAdminKey | quote }}
  wp-admin-password: {{ .Values.secrets.wpAdminPassword | quote }}
  woo-ck: {{ .Values.secrets.wooConsumerKey | quote }}
  woo-cs: {{ .Values.secrets.wooConsumerSecret | quote }}
  woo-mcp-token: {{ .Values.secrets.wooMcpToken | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
