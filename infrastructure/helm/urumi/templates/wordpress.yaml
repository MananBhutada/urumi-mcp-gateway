apiVersion: apps/v1
kind: Deployment
metadata: {name: wordpress, labels: {app: wordpress}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: wordpress}}
  template:
    metadata: {labels: {app: wordpress}}
    spec:
      containers:
        - name: wordpress
          image: wordpress:6-apache
          env:
            - {name: WORDPRESS_DB_HOST, value: mysql}
            - {name: WORDPRESS_DB_NAME, value: wordpress}
            - {name: WORDPRESS_DB_USER, value: wordpress}
            - {name: WORDPRESS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: urumi-secrets, key: mysql-password}}}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME','http://{{ .Values.ingress.storeHost }}');
                define('WP_SITEURL','http://{{ .Values.ingress.storeHost }}');
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO']==='https') { $_SERVER['HTTPS']='on'; }
          ports: [{containerPort: 80}]
          readinessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {{ toYaml .Values.resources.small | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/www/html}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: wordpress-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: wordpress}
spec: {selector: {app: wordpress}, ports: [{port: 80}]}
---
# Installs WP + WooCommerce, enables COD, seeds a product, provisions the REST key used by woo-mcp.
apiVersion: batch/v1
kind: Job
metadata:
  name: wp-setup
  annotations: {"helm.sh/hook": "post-install,post-upgrade", "helm.sh/hook-delete-policy": "before-hook-creation"}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsUser: 33, runAsGroup: 33}
      containers:
        - name: wpcli
          image: wordpress:cli
          env:
            - {name: WOO_CK, valueFrom: {secretKeyRef: {name: urumi-secrets, key: woo-ck}}}
            - {name: WOO_CS, valueFrom: {secretKeyRef: {name: urumi-secrets, key: woo-cs}}}
            - {name: WP_ADMIN_PW, valueFrom: {secretKeyRef: {name: urumi-secrets, key: wp-admin-password}}}
          command: ["sh","-c"]
          args:
            - |
              cd /var/www/html
              until [ -f wp-config.php ]; do echo waiting for wp-config; sleep 3; done
              until wp db check >/dev/null 2>&1; do echo waiting for db; sleep 3; done
              if ! wp core is-installed; then
                wp core install --url="http://{{ .Values.ingress.storeHost }}" --title="Urumi Store" \
                  --admin_user=admin --admin_password="$WP_ADMIN_PW" --admin_email=admin@urumi.local --skip-email
              fi
              wp plugin is-installed woocommerce || wp plugin install woocommerce --activate
              wp plugin activate woocommerce || true
              wp rewrite structure '/%postname%/' --hard
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery"}' --format=json
              wp option update woocommerce_currency INR
              wp wc tool run install_pages --user=admin || true
              if [ "$(wp wc product list --user=admin --format=count)" = "0" ]; then
                wp wc product create --name="Sample Tee" --type=simple --regular_price=499 --user=admin
              fi
              wp eval '
                global $wpdb; $ck=getenv("WOO_CK"); $cs=getenv("WOO_CS"); $t=$wpdb->prefix."woocommerce_api_keys";
                $wpdb->delete($t, ["description"=>"urumi-mcp"]);
                $wpdb->insert($t, ["user_id"=>1,"description"=>"urumi-mcp","permissions"=>"read_write",
                  "consumer_key"=>wc_api_hash($ck),"consumer_secret"=>$cs,"truncated_key"=>substr($ck,-7)]);'
              echo setup complete
          resources: {{ toYaml .Values.resources.small | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/www/html}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: wordpress-data}}]
