# Public: storefront + dashboard (which proxies /api and /mcp to the gateway). MCP servers/DBs have NO ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: urumi}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls: [{secretName: {{ .Values.ingress.tlsSecret }}, hosts: [{{ .Values.ingress.storeHost }}, {{ .Values.ingress.dashboardHost }}]}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.storeHost }}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: wordpress, port: {number: 80}}}}]}
    - host: {{ .Values.ingress.dashboardHost }}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: dashboard, port: {number: 80}}}}]}
