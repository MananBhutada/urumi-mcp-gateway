apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql, labels: {app: mysql}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password"]
          env:
            - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: urumi-secrets, key: mysql-root-password}}}
            - {name: MYSQL_DATABASE, value: wordpress}
            - {name: MYSQL_USER, value: wordpress}
            - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: urumi-secrets, key: mysql-password}}}
          ports: [{containerPort: 3306}]
          readinessProbe: {exec: {command: ["sh","-c","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"]}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {exec: {command: ["sh","-c","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"]}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {{ toYaml .Values.resources.db | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mysql-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec: {selector: {app: mysql}, ports: [{port: 3306}]}
