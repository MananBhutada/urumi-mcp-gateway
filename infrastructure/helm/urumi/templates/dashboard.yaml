apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, labels: {app: dashboard}}
spec:
  replicas: {{ .Values.replicas.dashboard }}
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.images.dashboard }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {{ toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: dashboard}
spec: {selector: {app: dashboard}, ports: [{port: 80, targetPort: 8080}]}
