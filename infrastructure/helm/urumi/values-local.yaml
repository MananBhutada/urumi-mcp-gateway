# Local-only disposable credentials for the demo cluster. Never reuse these in production.
appEnv: development
ingress:
  className: traefik
  storeHost: store.urumi.local
  dashboardHost: dashboard.urumi.local
secrets:
  mysqlRootPassword: local-root-only
  mysqlPassword: local-wp-only
  postgresPassword: local-pg-only
  gatewaySecretKey: local-dev-secret-key-not-for-production-123456
  bootstrapAdminKey: urumi_live_local_demo_key_do_not_reuse_123456789
  wpAdminPassword: local-admin-only
  wooConsumerKey: ck_local_demo_only
  wooConsumerSecret: cs_local_demo_only
  wooMcpToken: local-woo-mcp-token-only
  anthropicApiKey: ""
